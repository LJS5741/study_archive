<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #container {
      width: 1000px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
    }
    .item-container {
      display: flex;
      justify-content: center;
    }
    .item {
      padding: 10px;
      position: relative;
    }
    .overlay {
      width: 300px;
      height: 200px;
      top: -190px;
      position: absolute;
      box-sizing: border-box;
      opacity: 0;
      background-color: #00000099;
      color: white;
      text-align: center;
      transition-duration: 0.8s;
      transition-delay: 0.2s all;
      transition-timing-function: ease-in-out;
    }
    .item:hover .overlay {
      opacity: 1;
      transform: translateY(200px);
    }
  </style>
</head>
<body>
  <div id="container">
      <h1>신상품 목록</h1>
      <div class="item-container">
        <div class="item">
          <img src="./images/prod1.jpg" />
          <div class="overlay">
            <h2>상품 1</h2>
            <p>상품 1에 대한 설명</p>
            <p>가격 : 38,000원</p>
          </div>
        </div>
        <div class="item">
          <img src="./images/prod2.jpg" />
          <div class="overlay">
            <h2>상품 2</h2>
            <p>상품 2에 대한 설명</p>
            <p>가격 : 50,000원</p>
          </div>
        </div>
        <div class="item">
          <img src="./images/prod3.jpg" />
          <div class="overlay">
            <h2>상품 3</h2>
            <p>상품 3에 대한 설명</p>
            <p>가격 : 45,000원</p>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
