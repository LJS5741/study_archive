<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
    font-family: "Nanum Pen Script", cursive;
    font-weight: 400;
    font-style: normal;
    }
    .container {
      display: flex;
      width: 350px;
      height: 330px;
      margin: 0 auto;
      transform: rotate(10deg);
    }
    .box {
      display: flex;
      flex-direction: column;
      background-color: #ffff99;
      padding: 18px;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 44px;
      margin-bottom: 1px;
    }
    .write {
      font-size: 25px;
      margin-bottom: 1px;
    }
  </style>
</head>
<body>
    <div class="container">
      <div class="box">
        <h1 class="write">To. 남편</h1>
        <p class="write">여보~ 오늘 급하게 먼저 출근해야 해서<br>
           인사도 못하고 먼저 나가요~<br></p>
        <p class="write">아침 굶지 말고 냉장고에 있는 반찬<br>
          전자레인지에 데워서 챙겨 먹고 나가요~!</p>
        <p class="write">그럼 오늘 하루도 힘내고 이따 저녁에 봐요~<br>
          화이팅~!</p>
      </div>
    </div>
</body>
</html>
