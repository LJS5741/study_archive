<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      max-width: 1024px;
      width: 100%;
      height: 100%;
    }
    header {
      display: flex;
      height: 60px;
 
      justify-content: space-between;
      align-items: center;
      background-color: beige;
      border-bottom: 1px solid rgb(129, 129, 95);
    }
    .object {
      display: flex;
      flex-wrap: wrap;
      color: green;
    }
    .item {
      display: flex;
      flex: 1;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      padding: 6px 20px;
    }
    .box1 {
      background-color: #dda2a2;
      width: 50px;
      height: 50px;
      border-radius: 10px;
    }
    .box2 {
      background-color: #dda2a2;
      width: 50px;
      height: 50px;
      border-radius: 10px;
    }
    main {
      flex: 1;
      display: flex;
      margin: 10px;
      justify-content: center;
      align-items: center;
      padding-top: 105px;
    }
    .image {
      display: flex;
      flex-wrap: wrap;
      width: 100%;
      gap: 10px;
      justify-content: center;
    }
    .img {
      width: 160px;
      height: 240px;
      margin: 10px;
    }
    footer {
      height: 60px;
      background-color: #006241;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
    }
    p {
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="box1"></div>
      <div class="object">
        <div class="item">정치</div>
        <div class="item">경제</div>
        <div class="item">사회</div>
        <div class="item">문화</div>
      </div>
      <div class="box2"></div>
    </header>
    <main>
      <div class="image">
        <div class="img"><img src="./images/1.jpg"></div>
        <div class="img"><img src="./images/2.jpg"></div>
        <div class="img"><img src="./images/3.jpg"></div>
        <div class="img"><img src="./images/4.jpg"></div>
        <div class="img"><img src="./images/5.jpg"></div>
        <div class="img"><img src="./images/6.jpg"></div>
      </div>
    </main>
    <footer>
      <p>2025 My News Site</p>
    </footer>
  </div>
</body>
</html>
