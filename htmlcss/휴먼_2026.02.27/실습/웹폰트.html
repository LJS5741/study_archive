<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
      <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  <style>
    body {
      font-family: "Roboto", sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 224px;
      height: 330px;
      border: 2px solid lightgray;
      margin: 0 auto;
      padding: 28px 38px;
      justify-content: space-between;
    }
    .box {
      width: 228px;
      height: 44px;
      font-size: 14px;
      font-weight: bold;
      color: #504444;
      border: 2px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .or {
      display: flex;
      font-size: 16px;
      font-weight: bold;
      color: #504444;
    }
    .ID {
      display: flex;
      width: 228px;
      height: 44px;
      font-size: 16px;
      font-weight: bold;
      background-color: #eaeaea;
      border: none;
    }
    .PW {
      display: flex;
      width: 228px;
      height: 44px;
      font-size: 16px;
      font-weight: bold;
      background-color: #eaeaea;
      border: none;
    }
    .btn {
      display: flex;
      width: 228px;
      height: 44px;
      font-size: 14px;
      color: #ffffff;
      background-color: #373f3c;
      border: none;
      justify-content: center;
      align-items: center;
    }
    .forgot_pw {
      font-size: 14px;
      color: #2c3432;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <div class="google_login">
        <i class="fa-brands fa-google"></i> Log in with Google</div>
    </div>
    <div class="or">or</div>
      <input class="ID" type="text" placeholder="Username">
      <input class="PW" type="password" placeholder="Password">
      <div class="btn">LOGIN</div>
    <div class="forgot_pw">Forgot your password?</div>

  </div>
</body>
</html>
