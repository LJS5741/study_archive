<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      box-sizing: border-box;
      text-align: center;
    }
    p {
      color: gray;
    }
    .card {
      width: 220px;
      padding: 24px;
      border: 2px solid black;
      box-shadow: 6px 6px 0;

    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto;
      background-color: blue;
    }
    .stat {
      border-top: 1px solid lightgray;
      margin-top: 20px;
      padding: 15px;
      display: inline-block;
      justify-content: center;
    }
    .num {
      color: red;
      font-weight: bold;
      font-size: 20px;
    }
    .lbl {
      color: #a1a1a1;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
  <div class="avatar">👩‍💻</div>
  <h3>Kim Coder</h3>
  <p class="role">FRONTEND DEV</p>
  <div class="stats">
    <div class="stat">
      <div class="num">128</div>
      <div class="lbl">Projects</div>
    </div>
    <div class="stat">
      <div class="num">4.9</div>
      <div class="lbl">Rating</div>
    </div>
    <div class="stat">
      <div class="num">5yr</div>
      <div class="lbl">Exp</div>
    </div>
  </div>
</div>
</body>
</html>
