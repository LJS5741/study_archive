<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h2 {
      font-family: serif;
    }
    p {
      font-family: sans-serif;
      line-height: 1.9;
      color: #444;
    }
    .byline {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #999;
    }
    p::first-letter {
      font-size: 3em;
      font-weight: bold;
      float: left;
      color: #ff3939;
      margin-right: 6px;
      line-height: 1;
    }
    .highlight {
      background-color: yellow;
    }
    .underline-fancy {
      text-decoration: underline wavy red;
    }
    


  </style>
</head>
<body>
  <article>
  <h2>CSS가 바꾼 웹 디자인의 역사</h2>
  <p class="byline">by Kim Coder · Web Design Weekly</p>
  <p>CSS는 <span class="highlight">콘텐츠와 표현을 분리</span>하는
  혁신적인 기술입니다. 오늘날 우리가 사용하는 웹 페이지는 
  <span class="underline-fancy">CSS 없이는 상상할 수 없습니다.</span></p>
</article>
</body>
</html>
