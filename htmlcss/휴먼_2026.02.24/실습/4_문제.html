<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .banner {
      width: 100%;
      height: 200px;
      color: white;
      align-items: center;
      justify-content: center;
      display: flex;
      flex-direction: column;
      background:  
      linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
      repeating-linear-gradient(
        45deg,
        #4b3f72,
        #b423ee 10px,
        #4979fc 10px,
        #5e548e 20px
      );
      background-size: cover, 40px, 40px;
      background-position: center;
      background-attachment: fixed;
    }
    .banner h3 {
      font-size: 20px;
      margin-bottom: 0;
    }
    .banner p {
      font-size: 12px;
    }

  </style>
</head>
<body>
  <div class="banner">
    <h3>웹 디자인의 미래</h3>
    <p>CSS 배경 속성으로 만드는 인상적인 레이아웃</p>
  </div>
</body>
</html>
