<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .badge {
      position: relative;
    }
    .item {
      width: 100px;
      height: 100px;
      top: 50px;
      background-color: blue;
      border-radius: 20px;
    }
    .item:nth-child(1) {
      position:relative;
    }
    .item:nth-child(2) {
      position: absolute;
      left: 150px;
    }
    .item:nth-child(3) {
      position: absolute;
      left : 300px;
    }
    .circle {
      position: relative;
      width : 40px;
      height: 40px;
      background-color: red;
      border-radius: 50px;
      left: 75px;
      top: -10px;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>

</head>
<body>
  <div class="badge">
    <div class="item">
      <div class="circle">1</div>
    </div>
    <div class="item">
      <div class="circle">2</div>
    </div>
    <div class="item">
      <div class="circle">3</div>
    </div>
  </div>
</body>
</html>
