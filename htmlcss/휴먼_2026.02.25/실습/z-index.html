<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      width: 300px;
      position: relative;
      background-color: royalblue;
    }
    .box1 {
      width: 100px;
      height: 100px;
      background-color: orange;
      border: 4px dashed red;
    }
    .box2 {
      width: 100px;
      height: 100px;
      top: 50px;
      left: 50px;
      position: absolute;
      background-color: orange;
      border: 4px dashed red;
      z-index: 1;      
    }
    .box3 {
      width: 100px;
      height: 100px;
      background-color: orange;
      border: 4px dashed red;
      
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
  </div>
</body>
</html>
