<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>My Web Profile</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #main-title {
      color: blue;
    }
    .tagline {
      font-style: italic;
      color: gray;
    }
    .highlight {
      background-color: #fff9c4;
      border: 1px solid black;
      padding: 2px 4px;
    }
    section > h2 {
      font-size: 24px;
      text-decoration: underline;
    }
    .skill-item {
      background-color: gray;
      text-align: center;
      padding: 2px 4px;
    }
    .project h3 {
      color: green;
    }
    .project > p {
      color: purple;
    }
    footer p {
      font-size: 14px;
      text-align: center;
    }
    .projects .project:first-of-type {
      background: #e0f7fa;
    }
    .projects .project:last-child h3 {
      font-weight: bold;
      font-size: 40px;
    }
    ul {
      list-style: none;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="main-title">나의 웹 프로필</h1>
    <p class="tagline">프론트엔드 개발자를 꿈꾸는 안유진 입니다.</p>
  </header>

  <section class="about">
    <h2>About Me</h2>
    <p>안녕하세요! 저는 웹 개발을 공부하고 있는 예비 개발자입니다.</p>
    <p class="highlight">CSS 선택자 연습을 통해 꾸미는 재미를 배우고 있어요.</p>
  </section>

  <section class="skills">
    <h2>Skills</h2>
    <ul>
      <li class="skill-item">HTML</li>
      <li class="skill-item">CSS</li>
      <li class="skill-item">JavaScript</li>
    </ul>
  </section>

  <section class="projects">
    <h2>Projects</h2>
    <div class="project">
      <h3>나만의 블로그</h3>
      <p>HTML과 CSS로 만든 첫 블로그입니다.</p>
    </div>
    <div class="project">
      <h3>미니 게임</h3>
      <p>JavaScript로 만든 간단한 클릭 게임입니다.</p>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Hong Gil-Dong</p>
  </footer>
</body>
</html>
