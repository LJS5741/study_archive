plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jpa_study'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA 사용
	implementation 'org.springframework.boot:spring-boot-starter-web' // Controller/API 사용

	implementation 'org.springframework.boot:spring-boot-starter-security' // Spring Security 추가

	compileOnly 'org.projectlombok:lombok' // Lombok 컴파일용
	developmentOnly 'org.springframework.boot:spring-boot-devtools' // 개발 편의 기능
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11' // Oracle JDBC 드라이버

	annotationProcessor 'org.projectlombok:lombok' // Lombok 어노테이션 처리

	testImplementation 'org.springframework.boot:spring-boot-starter-test' // 테스트
	testImplementation 'org.springframework.security:spring-security-test' // Security 테스트

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}