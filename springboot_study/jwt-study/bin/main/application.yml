spring:
  application:
    name: jwt-study-step2-starter

  datasource:
    # MySQL에 jwt_study 데이터베이스를 먼저 만들어두세요.
    # 예: CREATE DATABASE jwt_study DEFAULT CHARACTER SET utf8mb4;
    url: jdbc:mysql://localhost:3306/jwt_study?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8080
